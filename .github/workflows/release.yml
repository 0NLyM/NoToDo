name: Release

# Avvio manuale: Actions › Release › Run workflow. Richiede i secret
# NOTODO_KEYSTORE_B64 (keystore in base64) e NOTODO_KEYSTORE_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da creare (es. v0.1.0-alpha01); servono le note in docs/release/<tag>.md"
        required: true
      prerelease:
        description: "Pre-release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      KS_B64: ${{ secrets.NOTODO_KEYSTORE_B64 }}
      KS_PASSWORD: ${{ secrets.NOTODO_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Chiave di firma
        run: |
          test -n "$KS_B64" && test -n "$KS_PASSWORD" || { echo "::error::Mancano i secret NOTODO_KEYSTORE_B64 / NOTODO_KEYSTORE_PASSWORD"; exit 1; }
          test -f "docs/release/$TAG.md" || { echo "::error::Mancano le note docs/release/$TAG.md"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/notodo.jks"
      - name: Test e build firmata
        run: >
          ./gradlew testDebugUnitTest assembleRelease
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/notodo.jks"
          -Pandroid.injected.signing.store.password="$KS_PASSWORD"
          -Pandroid.injected.signing.key.alias=notodo
          -Pandroid.injected.signing.key.password="$KS_PASSWORD"
      - name: Pubblica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="NoToDo-${TAG#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "NoToDo ${TAG#v}" \
            --notes-file "docs/release/$TAG.md" ${{ inputs.prerelease && '--prerelease' || '' }}
